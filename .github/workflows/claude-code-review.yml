# Copy to .github/workflows/claude-code-review.yml in your repo.
# NOTE: requires either CLAUDE_CODE_OAUTH_TOKEN (Claude Max plan) or
# ANTHROPIC_API_KEY (direct API / GitHub App via /install-github-app). Pass
# secrets explicitly (below) rather than via `secrets: inherit`: GitHub only
# inherits secrets into a reusable workflow owned by the same org/user, so a
# cross-owner caller (e.g. a UCD-SERG-org repo calling this d-morrison
# user-owned workflow) inherits an empty token and the run fails env-validation.
# claude.yml dispatches this workflow by filename, so keep the file named
# claude-code-review.yml (or set claude.yml's review-workflow-file to match).
name: Claude Code Review

on:
  # On-request only (#44): there is deliberately no `pull_request` trigger, so
  # opening a PR, pushing to it, reopening it, or marking it ready for review
  # does not start a review on its own. Three paths still reach this workflow,
  # all of them a dispatch:
  #   * a manual dispatch --- `gh workflow run claude-code-review.yml
  #     --ref <pr-branch> -f pr_number=<N>`, or the "Run workflow" button;
  #   * an `@claude review` comment on the PR, which claude.yml turns into
  #     exactly that dispatch;
  #   * an @claude agent run on a PR that pushes commits. claude.yml's
  #     "Dispatch code review after Claude pushed commits" step fires on a
  #     changed head SHA alone, with no review-request condition, so asking
  #     the agent for an unrelated fix still costs a review round. That step
  #     lives in the callee and has no caller-side opt-out (Morrison-Lab/gha#778).
  # The callee supports a dispatch-only caller end to end. `preempt-previous`,
  # `gather-context`, and `claude-review` each admit
  # `github.event_name == 'workflow_dispatch'` as their own arm; `post-review`
  # and `require-review` gate on the other jobs' results rather than on the
  # event, so they are event-agnostic. Every PR number any of them reads falls
  # back to `inputs.pr-number` when there is no pull_request payload.
  # Two consequences worth knowing before adding a branch-protection rule.
  # `review / require-review` does not appear at all on a PR nobody has
  # requested a review for, so it must not be listed as a required check. And
  # a dispatch that resolves no `--ref` runs against the default branch, so its
  # check runs attach to that branch rather than to the PR head (gha#285) even
  # though the review comment still posts on the PR --- hence the `--ref` in
  # the manual command above.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets the reviewer read CI status (github_ci MCP server)
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # Max-plan OAuth; empty when using API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # direct API key; empty when using OAuth
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}   # optional; empty when unset
    with:
      # Wires the workflow_dispatch input through. It is the only source of the
      # PR number here, since there is no pull_request payload to fall back on.
      pr-number: ${{ inputs.pr_number }}
      # Install the shared Morrison-Lab/ai-config plugin, so the reviewer
      # applies the lab's shared review conventions rather than only this
      # repo's own prose. The callee already defaults this to true at @v2, so
      # it is on today; pinning it in the caller keeps it on if that default
      # ever moves, and makes the choice visible here rather than implicit in
      # the callee (#36).
      use-ai-config: true
    # with:
    #   checkout-submodules: true   # SUBMODULES_TOKEN secret only for private submodules
    #   plugin-marketplaces: https://github.com/<owner>/<repo>.git  # extra marketplaces on top of ai-config
    #   plugins: <plugin>@<marketplace-name>  # extra plugins installed alongside ai-config
    #   allowed-bots: 'github-actions[bot],claude'   # accept more bot actors (default: github-actions[bot])
    #   prompt-addendum: |
    #     Repo-specific review guidance (e.g. Quarto/R conventions to enforce).
